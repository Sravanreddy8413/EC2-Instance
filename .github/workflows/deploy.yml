name: Deploy Application

on:
  push:
    branches:
      - main # Triggers on push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/your-app-directory # Replace with your project folder path
            git pull origin main
            npm install                    # Adjust if using yarn/pip/docker
            pm2 restart all || pm2 start index.js --name "app" # Adjust to your process manager
